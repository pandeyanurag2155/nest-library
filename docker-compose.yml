version: '3'

services:
  redis-stack:
    image: redis/redis-stack-server:latest
    container_name: redis-stack-container
    ports:
      - "6387:6379"  # Exposes port 6379 in the container to port 6387 on the host
    networks:
      - nestjs-network
    volumes:
      - redis-data:/data
  
  redisinsight:
    image: redis/redisinsight:latest
    container_name: redisinsight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight:/data
    restart: unless-stopped
    depends_on:
      - redis-stack

  

networks:
  nestjs-network:
    driver: bridge

volumes:  
  redis-data:
    driver: local
  redisinsight:
    driver: local
  
